spring.application.name=curd

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:employee_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

app.jwt.issuer=Aivra_Backend
app.jwt.access-minutes=15
app.jwt.secret=Y5oMtcHVBKKW9lRn32ntkRKQPe/aasQQigiQUR2SB3I=
app.jwt.refresh-days=7

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html